<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
</head>
<body>
    <h1>My Expense Tracker</h1>
    <p>Track where your MONEY goes</p>
    <input type="text" id="description" placeholder="What did you buy?">
    <input type="number" id="amount" placeholder="Amount in INR" step="0.01">
    <button id="addBtn">Add Expense</button>

    <h2>My Expenses</h2>
    <ul id ="expenseList"></ul>
    <h3>Total: INR <span id="total">0.00</span></h3>
</body>
</html>
